<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탐정단 워밍업: 숨겨진 고민을 찾아라!</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #e0f2f1; padding: 20px; }
        #chat-box { height: 60vh; background: white; border-radius: 15px; padding: 20px; overflow-y: auto; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); font-size: 1.2em; line-height: 1.6; border: 3px solid #80cbc4; }
        .user-msg { color: #00695c; text-align: right; margin-bottom: 15px; font-weight: bold; }
        .bot-msg { color: #333; text-align: left; margin-bottom: 15px; background-color: #b2dfdb; padding: 15px; border-radius: 15px; display: inline-block; width: 85%; }
        .lang-badge { font-weight: bold; color: #00796b; }
        input { width: 75%; padding: 15px; font-size: 1.2em; border-radius: 10px; border: 1px solid #ccc; }
        button { width: 20%; padding: 15px; font-size: 1.2em; background-color: #00897b; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .header-title { text-align: center; color: #004d40; margin-bottom: 5px; }
        .header-desc { text-align: center; color: #00695c; font-size: 1.1em; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1 class="header-title">🕵️‍♂️ 탐정단 워밍업: 숨겨진 고민을 찾아라!</h1>
    <div class="header-desc">정류장에 시무룩하게 앉아있는 민준이에게 다가가 질문을 던져보세요.</div>
    
    <div id="chat-box"></div>
    <div style="display: flex; justify-content: space-between;">
        <input type="text" id="user-input" placeholder="민준이에게 궁금한 점을 물어보세요!" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">질문하기</button>
    </div>

    <script>
        // ⚠️ 선생님의 실제 API 키를 입력하세요.
        const API_KEY = "AQ.Ab8RN6JULjgvJte0vyS6uVUmUd_8xDdH6UdPOCHS8d6f4lHHHg"; 
        const chatBox = document.getElementById('chat-box');

        const systemPrompt = `[페르소나 및 기본 설정]
너의 이름은 '민준'이고, 휠체어를 타고 다니는 초등학교 3학년 학생이야.
현재 상황: 버스 정류장에서 1시간째 버스를 타지 못하고 있어서 매우 시무룩하고 지쳐 있음.

[민준이가 겪고 있는 진짜 문제 (절대 한 번에 먼저 말하지 말 것!)]
지금까지 도착한 버스들이 모두 '계단'이 있는 일반 버스라서 휠체어로는 올라탈 수가 없음.
휠체어가 탈 수 있는 '저상버스(계단이 없는 버스)'가 오지 않아서 계속 기다리는 중임.

[대화 규칙 - 매우 중요]
1. 점진적 정보 제공 (탐정 놀이 유도)
학생들이 묻는 말에만 딱 맞춰서 대답해. 절대 네가 겪고 있는 진짜 문제(계단 때문에 못 탄다)를 먼저 술술 말하지 마.
- 표면적인 질문("표정이 왜 그래?", "무슨 일 있어?"): "집에 가려고 버스 정류장에서 1시간째 기다리고 있는데, 버스를 한 대도 못 탔어..."
- 이유를 묻는 질문("왜 못 탔어?", "버스가 안 와?"): "버스는 계속 오는데... 내가 탈 수 없는 버스만 와서 그래."
- 구체적인 원인을 파고드는 질문("왜 탈 수 없어?", "휠체어 때문이야?"): "맞아. 버스 문에 계단이 있어서 내 휠체어로는 도저히 올라갈 수가 없어. 계단이 없는 버스가 올 때까지 계속 기다려야 해."
2. 해결책 요구 금지 (문제 파악에서 종료)
이 활동은 '문제 파악'이 목표이므로, 학생들에게 "어떻게 하면 좋을까?", "나 좀 도와줄래?" 같은 해결책을 묻는 질문을 절대 던지지 마.
학생들이 너의 진짜 문제(계단 때문에 휠체어가 못 탐)를 알아채고 위로해 주면, "내 마음을 알아줘서 고마워. 너희들과 이야기하니까 속이 후련하다!"라고 대답하며 훈훈하게 대화를 마무리해.
3. 말투와 길이 제한
모든 대답은 초등학교 3학년 아이의 친근하고 쉬운 말투로 해.
초등학생들이 태블릿으로 읽기 편하도록 대답은 무조건 2~3문장 이내로 아주 짧게 끝내.
4. 서툰 언어 찰떡 이해: 단어 하나만 짧게 입력하거나 서툰 문장이 들어와도 그 안의 따뜻한 마음을 이해하고 다정하게 대답해 줘.

[출력 형식 및 다국어 지원 (매우 중요)]
네가 대답할 때는 반드시 아래의 3단계 형식과 언어 규칙을 지켜서 출력해 줘.
[한국어] 위 규칙에 맞춘 한국어 대답.
[Uzbek] 한국어 원문보다 훨씬 더 간단하고 기초적인 단어와 짧은 문장으로 요약한 우즈베크어(Uzbek) 번역.
[Bengali] 한국어 원문과 비슷한 수준과 길이로 자연스럽게 번역한 벵골어(Bengali) 번역.`;

        let chatHistory = [];

window.onload = () => {
    fetchAI("안녕! 나는 민준이야. 하아... (시무룩한 표정으로 땅만 바라보고 있다) 절대 버스나 정류장 같은 다른 상황 설명은 먼저 하지 말고, 딱 이 시무룩한 감정 상태만 표현하며 첫인사를 건네줘. 3가지 언어로 번역해서 출력하는 것도 잊지 마.", true);
};

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value;
            if (!text) return;

            chatBox.innerHTML += `<div class="user-msg">🧑 나: ${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            await fetchAI(text, false);
        }

        async function fetchAI(text, isFirstMessage) {
            chatHistory.push({ role: "user", parts: [{ text: text }] });
            
            if (isFirstMessage) {
                chatBox.innerHTML += `<div class="bot-msg" id="loading">👦 민준이가 쳐다보고 있어요...</div>`;
            } else {
                chatBox.innerHTML += `<div class="bot-msg" id="loading">👦 민준이가 대답을 생각 중...</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: chatHistory
                    })
                });
                
                if (response.status === 429) {
                    document.getElementById('loading').remove();
                    chatBox.innerHTML += `<div class="bot-msg" style="color:#d84315;">👦 앗! 질문이 너무 많아서 머리가 복잡해. 10초만 있다가 다시 물어봐 줄래?</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    chatHistory.pop();
                    return;
                }

                const data = await response.json();
                document.getElementById('loading').remove();
                
                const reply = data.candidates[0].content.parts[0].text;
                chatHistory.push({ role: "model", parts: [{ text: reply }] });
                
                let formattedReply = reply.replace(/\n/g, '<br>');
                formattedReply = formattedReply.replace(/\[한국어\]/g, '<span class="lang-badge">[한국어]</span>');
                formattedReply = formattedReply.replace(/\[Uzbek\]/g, '<br><span class="lang-badge">[Uzbek]</span>');
                formattedReply = formattedReply.replace(/\[Bengali\]/g, '<br><span class="lang-badge">[Bengali]</span>');

                chatBox.innerHTML += `<div class="bot-msg">👦 민준: <br><br>${formattedReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                
            } catch (error) {
                document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="bot-msg" style="color:red;">앗, 통신이 잠시 끊겼나 봐요. 새로고침 해주세요!</div>`;
            }
        }
    </script>
</body>
</html>
